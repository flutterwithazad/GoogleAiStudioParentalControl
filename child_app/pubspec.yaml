name: screen_mirror_child
description: Child device client for remote screen mirroring parental control.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.12.5
  supabase_flutter: ^2.8.3
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.3.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.3
  screen_mirror_shared:
    path: ../shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
