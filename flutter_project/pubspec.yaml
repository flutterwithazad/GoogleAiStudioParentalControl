name: screen_mirror_parental
description: Android-only Flutter remote screen mirroring parental-control application suite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Real-time WebRTC audio/video transport for Flutter
  flutter_webrtc: ^0.12.5

  # Supabase client for authentication, device pairing, and Realtime signaling
  supabase_flutter: ^2.8.3

  # Secure storage for device tokens and authentication session
  flutter_secure_storage: ^9.2.2

  # Device information and hardware model identification
  device_info_plus: ^11.3.0

  # Permission handling for POST_NOTIFICATIONS (Android 13+)
  permission_handler: ^11.3.1

  # QR code generation and scanning for device pairing
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0

  # State management
  flutter_riverpod: ^2.6.1

  # UUID generation for pairing codes and session IDs
  uuid: ^4.5.1

  # Network connectivity detection for adaptive WebRTC bitrate
  connectivity_plus: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/
